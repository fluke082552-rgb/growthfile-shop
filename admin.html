<!DOCTYPE html>
<html>
<body>

<!-- ส่วนของหน้าตาปุ่มกรอกรหัส -->
<div id="admin-login">
    <input type="password" id="adm-pass" placeholder="ใส่รหัสของคุณ">
    <button onclick="checkAdminLogin()">เข้าสู่แผงควบคุมหลัก</button>
</div>

<!-- ส่วนของ Dashboard (จะแสดงก็ต่อเมื่อล็อกอินผ่าน) -->
<div id="admin-dashboard" style="display:none;">
    <h1>ยินดีต้อนรับสู่ Dashboard</h1>
    <button onclick="adminLogout()">ออกจากระบบ</button>
</div>

<script>
var AMIN_PIN = "ALOCK1234";

function checkAdminLogin() {
    var pass = document.getElementById('adm-pass').value;
    if (pass === AMIN_PIN) {
        document.getElementById('admin-login').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';
    } else {
        alert('รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง!');
    }
}

function adminLogout() {
    location.reload();
}
</script>

</body>
</html>
